default: &default
  adapter: postgresql
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  timeout: 5000
  encoding: unicode
  username: <%= ENV.fetch('PSQL_USER', 'spot_dev_user') %>
  password: <%= ENV.fetch('PSQL_PASSWORD', 'spot_dev_pw') %>
  host: <%= ENV.fetch('PSQL_HOST', 'localhost') %>

development:
  <<: *default
  database: <%= ENV.fetch('PSQL_DATABASE', 'spot_development') %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch('PSQL_TEST_DATABASE', 'spot_test') %>

production:
  <<: *default


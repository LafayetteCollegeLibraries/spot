# @note We can change this to be `url: <%= ENV['SOLR_URL'] %> in Hyrax >= 5
development:
  host: <%= ENV['VALKYRIE_SOLR_HOST'] %>
  port: <%= ENV['VALKYRIE_SOLR_PORT'] %>
  core: <%= ENV['VALKYRIE_SOLR_CORE'] || 'spot-development' %>
test:
  host: <%= ENV['VALKYRIE_SOLR_HOST'] %>
  port: <%= ENV['VALKYRIE_SOLR_PORT'] || 8983 %>
  core: <%= ENV['VALKYRIE_SOLR_CORE_TEST'] || 'spot-test' %>
production:
  host: <%= ENV['VALKYRIE_SOLR_HOST'] %>
  port: <%= ENV['VALKYRIE_SOLR_PORT'] %>
  core: <%= ENV['VALKYRIE_SOLR_CORE'] || 'spot' %>

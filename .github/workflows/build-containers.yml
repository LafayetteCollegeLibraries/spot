name: Build containers
on:
  workflow_call:
    secrets:
      username:
        required: true
        description: "Username value for container repository"
      password:
        required: true
        description: "Password/token value for container repository"
      registry:
        required: false
        description: "URL for container repository (default: DockerHub)"
    inputs:
      tag:
        type: string
        required: true
        description: "Version identifier for release"
      services:
        type: string
        required: true
        description: "Stringified JSON array of which service containers to build"
        default: '["rails","sidekiq","fcrepo","solr","fits_servlet"]'
      environments:
        type: string
        required: true
        description: Stringified JSON array of GitHub environments to use for variables
        default: '["stage","production"]'

jobs:
  build_containers:
    name: Build containers
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: ${{ fromJson(inputs.environments) }}
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@v4
      -
        name: Log into Docker
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.registry || 'docker.io' }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Get config
        id: config
        env:
          CURRENT_SERVICE: ${{ matrix.service }}
        run: |
          config="{}"
          case "${CURRENT_SERVICE}" in
            "rails")
              config="{\"image\": \"lafayette/rails\", \"context\": \".\", \"target\": \"spot-web-production\"}"
              ;;
            "sidekiq")
              config="{\"image\": \"lafayette/sidekiq\", \"context\": \".\", \"target\": \"spot-worker-production\"}"
              ;;
            "solr")
              config="{\"image\": \"lafayette/solr\", \"context\": \"./docker/solr\"}"
              ;;
            "fcrepo")
              config="{\"image\": \"lafayette/fc\", \"context\": \"./docker/fcrepo\"}"
              ;;
            "fits_servlet")
              config="{\"image\": \"lafayette/fits_servlet\", \"context\": \"./docker/fits_servlet\"}"
              ;;
          esac
          echo "value=${config}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push ${{ steps.config.outputs.value.image }} container
        uses: ./.github/actions/build-container
        with:
          registry: ${{ secrets.registry || 'docker.io' }}
          tag: ${{ inputs.tag }}
          image_name: ${{ steps.config.outputs.value.image }}
          context: ${{ steps.config.outputs.value.context }}
          target: ${{ steps.config.outputs.value.target }}
